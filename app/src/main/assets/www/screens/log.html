<div style="width: 100%; height: 100%; box-sizing: border-box; background: #F1ECE1; font-family: 'Space Grotesk', sans-serif; color: #0E0E0E; padding: 40px 22px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div class="rise" style="display: flex; flex-direction: column; gap: 4px; flex: none">
<h1 style="margin: 0; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.05em">log.</h1>
<div id="log-sub" style="font-size: 15px; color: #4A463E">Every cleanup, and a way back.</div>
</div>
<div id="log-list" style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px"></div>
<nav class="rise" aria-label="Main" style="animation-delay: 1.25s; margin-top: auto; display: flex; border: 3px solid #0E0E0E; background: #FFFFFF; flex: none">
<button type="button" data-nav="mess" style="flex: 1; min-height: 48px; border: 0; border-right: 3px solid #0E0E0E; border-radius: 0; background: #FFFFFF; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">mess</button>
<button type="button" data-nav="rules" style="flex: 1; min-height: 48px; border: 0; border-right: 3px solid #0E0E0E; border-radius: 0; background: #FFFFFF; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">rules</button>
<button type="button" data-nav="trash" style="flex: 1; min-height: 48px; border: 0; border-right: 3px solid #0E0E0E; border-radius: 0; background: #FFFFFF; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">trash</button>
<button type="button" data-nav="log" aria-current="page" style="flex: 1; min-height: 48px; border: 0; border-radius: 0; background: #0E0E0E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">log</button>
</nav>
</div>
