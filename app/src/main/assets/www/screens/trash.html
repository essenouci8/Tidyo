<div style="width: 100%; height: 100%; box-sizing: border-box; background: #F1ECE1; font-family: 'Space Grotesk', sans-serif; color: #0E0E0E; padding: 40px 22px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div class="rise" style="display: flex; flex-direction: column; gap: 4px; flex: none">
<h1 style="margin: 0; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -0.05em">trash.</h1>
<div id="trash-sub" style="font-size: 15px; color: #4A463E">30 days, then gone for good.</div>
</div>
<div class="rise" style="animation-delay: .25s; flex: none; background: #FFD23F; border: 3px solid #0E0E0E; box-shadow: 5px 5px 0 #0E0E0E; padding: 14px; display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em">SITTING IN TRASH</div>
<div style="display: flex; align-items: flex-end; gap: 10px"><span id="trash-n" style="font-family: 'Syne', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.85; letter-spacing: -0.05em">0</span><span id="trash-u" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; padding-bottom: 4px">FILES</span></div>
<div id="trash-until" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700"></div>
</div>
<div class="rise" style="animation-delay: .4s; flex: none; display: flex; flex-direction: column; gap: 8px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em">BY CLEANUP</div></div>
<div id="trash-list" style="flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px"></div>
<button type="button" id="btn-empty" class="rise" style="animation-delay: .55s; flex: none; height: 56px; border: 3px solid #0E0E0E; border-radius: 0; background: #FF4D2E; color: #0E0E0E; box-shadow: 5px 5px 0 #0E0E0E; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; cursor: pointer">empty trash now</button>
<nav class="rise" aria-label="Main" style="animation-delay: 1.25s; margin-top: auto; display: flex; border: 3px solid #0E0E0E; background: #FFFFFF; flex: none">
<button type="button" data-nav="mess" style="flex: 1; min-height: 48px; border: 0; border-right: 3px solid #0E0E0E; border-radius: 0; background: #FFFFFF; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">mess</button>
<button type="button" data-nav="rules" style="flex: 1; min-height: 48px; border: 0; border-right: 3px solid #0E0E0E; border-radius: 0; background: #FFFFFF; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">rules</button>
<button type="button" data-nav="trash" aria-current="page" style="flex: 1; min-height: 48px; border: 0; border-right: 3px solid #0E0E0E; border-radius: 0; background: #0E0E0E; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">trash</button>
<button type="button" data-nav="log" style="flex: 1; min-height: 48px; border: 0; border-radius: 0; background: #FFFFFF; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; cursor: pointer">log</button>
</nav>
</div>
