<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
@property --n { syntax: '<integer>'; inherits: true; initial-value: 800; }
@keyframes c800 {
0% { --n: 0; }
60%, 100% { --n: 800; }
}
@keyframes fillBlk {
0%, 2% { background: #2437E8; }
3%, 92% { background: #FFD23F; }
96%, 100% { background: #2437E8; }
}
@keyframes chomp {
0% { opacity: 0; transform: translateY(-70px) rotate(var(--r)); }
14% { opacity: 1; }
38%, 62% { opacity: 1; transform: translateY(0) rotate(var(--r)); }
86% { opacity: 1; transform: translateY(var(--dy)) rotate(0deg) scale(.55, .22); }
100% { opacity: 0; transform: translateY(var(--dy)) rotate(0deg) scale(.3, 0); }
}
@keyframes mouth {
0%, 100% { transform: scaleY(1); }
50% { transform: scaleY(2.2); }
}
@keyframes wob {
from { transform: rotate(var(--a)); }
to { transform: rotate(var(--b)); }
}
@keyframes blink {
0%, 49% { opacity: 1; }
50%, 100% { opacity: .15; }
}
.cnt { counter-reset: c var(--n); animation: c800 5s cubic-bezier(.2, .8, .3, 1) infinite; }
.cnt::before { content: counter(c); }
.blk { animation: fillBlk 5s steps(1, end) infinite; }
.card { animation: chomp 3.6s ease-in-out infinite both; }
.mouth { animation: mouth .9s ease-in-out infinite; }
.wob { animation: wob 1.3s ease-in-out infinite alternate; }
.blink { animation: blink 1s steps(1, end) infinite; }
@media (prefers-reduced-motion: reduce) { .cnt, .blk, .card, .mouth, .wob, .blink { animation: none !important; } }
</style>
</helmet>
